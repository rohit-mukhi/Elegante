<!DOCTYPE html>
<html>
<head>
  <title>Test Vector Search</title>
</head>
<body>
  <h1>Test Vector Search</h1>
  <button onclick="testSearch()">Test Search</button>
  <pre id="output"></pre>

  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0';

    window.testSearch = async function() {
      const output = document.getElementById('output');
      output.textContent = 'Loading model...\n';

      try {
        // Load model
        const model = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
        output.textContent += 'Model loaded!\n\n';

        // Generate embedding for search query
        const query = 'outfit for summer wedding';
        output.textContent += `Query: "${query}"\n`;
        
        const result = await model(query, { pooling: 'mean', normalize: true });
        const embedding = Array.from(result.data);
        
        output.textContent += `Embedding dimensions: ${embedding.length}\n`;
        output.textContent += `First 5 values: ${embedding.slice(0, 5).map(v => v.toFixed(4)).join(', ')}\n\n`;

        // Call backend
        output.textContent += 'Calling backend...\n';
        const response = await fetch('https://elegante-backend-srp-rm.vercel.app/api/search.js', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ embedding })
        });

        const data = await response.json();
        output.textContent += `\nResponse:\n${JSON.stringify(data, null, 2)}`;

      } catch (error) {
        output.textContent += `\nError: ${error.message}`;
      }
    }
  </script>
</body>
</html>
